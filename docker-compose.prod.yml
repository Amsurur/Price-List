services:
  postgres:
    image: postgres:18
    container_name: softclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-softclub}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-softclub_store}
    volumes:
      - softclub_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-softclub} -d ${DB_NAME:-softclub_store}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: softclub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_SSL: "false"
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-$$}
    container_name: softclub-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-$$}
    ports:
      - "80:3000"

volumes:
  softclub_pgdata:
